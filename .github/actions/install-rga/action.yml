# Installs ripgrep-all with its PDF and EPUB helpers on an Ubuntu runner.
# rga isn't in Ubuntu's archive, so it comes from the project's GitHub release.
name: Install ripgrep-all
description: rga and rga-preproc from the pinned release, plus ripgrep, poppler-utils and pandoc from apt.
inputs:
  version:
    description: ripgrep-all release tag
    default: v0.10.10
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RGA_VERSION: ${{ inputs.version }}
      run: |
        sudo apt-get update -q
        sudo apt-get install -q -y ripgrep poppler-utils pandoc
        name="ripgrep_all-${RGA_VERSION}-x86_64-unknown-linux-musl"
        curl -fsSL "https://github.com/phiresky/ripgrep-all/releases/download/${RGA_VERSION}/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/${name}/rga" "$RUNNER_TEMP/${name}/rga-preproc" /usr/local/bin/
        rga --version
